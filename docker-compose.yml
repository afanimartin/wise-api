services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wise
      POSTGRES_USER: wise
      POSTGRES_PASSWORD: wise
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wise -d wise"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
